name: Windows installer
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test prompt configuration
        shell: pwsh
        run: python ./tests/windows-config.test.py
      - name: Test Windows PowerShell 5.1
        shell: powershell
        run: ./tests/windows.test.ps1
      - name: Test PowerShell 7
        shell: pwsh
        run: ./tests/windows.test.ps1
