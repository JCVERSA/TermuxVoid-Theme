name: Windows installer
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test prompt configuration
        shell: pwsh
        run: python ./tests/windows-config.test.py
      - name: Test Windows PowerShell 5.1
        shell: powershell
        run: |
          try { ./tests/windows.test.ps1 } catch {
            Write-Output "::error::$($_.Exception.Message) at $($_.ScriptStackTrace)"
            exit 1
          }
      - name: Test PowerShell 7
        shell: pwsh
        run: |
          try { ./tests/windows.test.ps1 } catch {
            Write-Output "::error::$($_.Exception.Message) at $($_.ScriptStackTrace)"
            exit 1
          }
      - name: Test short command on Windows PowerShell 5.1
        shell: powershell
        run: |
          try { ./tests/windows-bootstrap.test.ps1 } catch {
            Write-Output "::error::$($_.Exception.Message) at $($_.ScriptStackTrace)"
            exit 1
          }
      - name: Test short command on PowerShell 7
        shell: pwsh
        run: |
          try { ./tests/windows-bootstrap.test.ps1 } catch {
            Write-Output "::error::$($_.Exception.Message) at $($_.ScriptStackTrace)"
            exit 1
          }
      - name: Test manager on Windows PowerShell 5.1
        shell: powershell
        run: |
          try { ./tests/windows-manager.test.ps1 } catch {
            Write-Output "::error::$($_.Exception.Message) at $($_.ScriptStackTrace)"
            exit 1
          }
      - name: Test manager on PowerShell 7
        shell: pwsh
        run: |
          try { ./tests/windows-manager.test.ps1 } catch {
            Write-Output "::error::$($_.Exception.Message) at $($_.ScriptStackTrace)"
            exit 1
          }
      - name: Test animation helpers on Windows PowerShell 5.1
        shell: powershell
        run: |
          try { ./tests/windows-animation.test.ps1 } catch {
            Write-Output "::error::$($_.Exception.Message) at $($_.ScriptStackTrace)"
            exit 1
          }
      - name: Test animation helpers and isolated dependencies
        shell: pwsh
        run: |
          try { ./tests/windows-animation.test.ps1 } catch {
            Write-Output "::error::$($_.Exception.Message) at $($_.ScriptStackTrace)"
            exit 1
          }
      - name: Test missing Python setup failure
        shell: powershell
        run: |
          try { ./tests/windows-python-missing.test.ps1 } catch {
            Write-Output "::error::$($_.Exception.Message) at $($_.ScriptStackTrace)"
            exit 1
          }
      - name: Test automatic portable Node setup
        shell: pwsh
        run: |
          try { ./tests/windows-node-portable.test.ps1 } catch {
            Write-Output "::error::$($_.Exception.Message) at $($_.ScriptStackTrace)"
            exit 1
          }
      - name: Test interactive idle behavior in a Windows pseudoconsole
        shell: pwsh
        run: |
          python -m pip install pywinpty==3.0.3 asciimatics==1.15.0 terminaltexteffects==0.15.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ./tests/windows-idle-demo.test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ./tests/windows-idle-interactive.test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test real Starship rendering
        shell: pwsh
        run: |
          try {
            $zip = Join-Path $env:RUNNER_TEMP 'starship-test.zip'
            Invoke-WebRequest -Uri 'https://github.com/starship/starship/releases/download/v1.24.1/starship-x86_64-pc-windows-msvc.zip' -OutFile $zip
            if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne '3D0ED9A2EFC07FCA7560D22AC622473D0B7317CDA6A792842F625CB9FE58C7BC') { throw 'Starship archive hash mismatch' }
            $dir = Join-Path $env:RUNNER_TEMP 'starship-test'
            Expand-Archive $zip -DestinationPath $dir
            ./tests/starship-render.test.ps1 -Starship (Join-Path $dir 'starship.exe')
            ./tests/windows-manager.test.ps1 -Starship (Join-Path $dir 'starship.exe')
          } catch {
            Write-Output "::error::$($_.Exception.Message) at $($_.ScriptStackTrace)"
            exit 1
          }
  manager_ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test interactive manager and shortcut
        shell: pwsh
        run: |
          python -m pip install pywinpty==3.0.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ./tests/windows-manager-interactive.test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
