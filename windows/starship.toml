# Windows Terminal + PowerShell prompt. Keep this separate from the Termux theme.
add_newline = false
format = """
[╭─](white)\
${env_var.USERNAME}\
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$rust\
$dotnet\
$package\
$cmd_duration\
$time\
$jobs\
\n[╰─](white)$character"""

# Starship's username module substitutes 'Administrator' in elevated Windows
# sessions. USERNAME keeps the actual account name visible in those sessions.
[env_var.USERNAME]
default = 'unknown'
format = '[\($env_value\)](bold green)'

[directory]
style = 'bold #87FF00'
format = '-\[[$path]($style)\]'
truncation_length = 3
truncation_symbol = '…/'

[git_branch]
symbol = '🌿 '
style = 'bold purple'
format = '-\[[$symbol$branch]($style)'

[git_status]
style = 'bold red'
format = '([ $all_status$ahead_behind]($style))\]'

[time]
disabled = false
time_format = '%H:%M:%S'
style = 'bold cyan'
format = ' [🕒 $time]($style)'

[jobs]
symbol = '⏳'
style = 'bold yellow'
format = ' [$symbol$number]($style)'

[character]
success_symbol = '[✅ ❯](bold green)'
error_symbol = '[❌ ❯](bold red)'

# Only visible when Starship detects the corresponding project files.
[nodejs]
symbol = 'Node '
format = ' \[[$symbol$version]($style)\]'

[python]
symbol = 'Py '
format = ' \[[$symbol$version( \($virtualenv\))]($style)\]'

[rust]
symbol = 'Rust '
format = ' \[[$symbol$version]($style)\]'

[dotnet]
symbol = '.NET '
format = ' \[[$symbol$version]($style)\]'

[package]
symbol = 'pkg '
format = ' \[[$symbol$version]($style)\]'

[cmd_duration]
min_time = 2000
format = ' [took $duration]($style)'
style = 'bold yellow'
